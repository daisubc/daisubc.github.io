speakers:
  - name: "Prof. Bhushan Gopaluni"
    role: "Primary Contact & Organizer"
    affiliation: "University of British Columbia"
    title: "Professor, Chemical & Biological Engineering"
    secondary: "Vice-Provost & Associate Vice-President, Faculty Planning"
    location: "Vancouver, Canada"
    photo: "/assets/img/ifac2026/bhushan.jpg"
    profile_url: "https://dais.chbe.ubc.ca/"
    sessions: "Welcome · LLM and Agent Fundamentals · Application I (with Dr. Mercangöz) · Hands-On · Roundtable moderator"
    bio: |
      Directs the Data Analytics and Intelligent Systems (DAIS) Lab, focusing on machine learning,
      reinforcement learning, and data analytics for process industries. Author of over 200 refereed
      publications. Recipient of the UBC Killam Teaching Prize and the D.G. Fisher Award from the
      Canadian Society for Chemical Engineering. Extensive experience organizing IFAC workshops,
      including sessions at ADCHEM and DYCOPS.
  - name: "Dr. Mehmet Mercangöz"
    role: "Speaker & Organizer"
    affiliation: "Imperial College London"
    title: "ABB Reader in Autonomous Industrial Systems"
    secondary: "Sargent Centre for Process Systems Engineering"
    location: "London, United Kingdom"
    photo: "/assets/img/ifac2026/mehmet.jpg"
    profile_url: "https://profiles.imperial.ac.uk/m.mercangoz"
    sessions: "Application I (with Prof. Gopaluni) · Application II (Autonomous Control and Industrial Applications) · Hands-On · Roundtable panellist"
    bio: |
      Spent 14 years at ABB Corporate Research, most recently as coordinator for industrial
      artificial intelligence, before joining Imperial College. His combination of academic
      research and industrial R&D experience uniquely positions him to address the practical
      challenges of deploying LLM agents in industrial settings. Current research focuses on
      agentic frameworks that leverage LLMs for autonomous industrial control with appropriate
      safety guarantees.
  - name: "Prof. Chunhui Zhao"
    role: "Speaker & Organizer"
    affiliation: "Zhejiang University"
    title: "Professor, College of Control Science and Engineering"
    secondary: ""
    location: "Hangzhou, China"
    photo: "/assets/img/ifac2026/chunhui.jpg"
    profile_url: "https://person.zju.edu.cn/en/chhzhao"
    sessions: "Application III — Time-Series Understanding and Explainable Fault Diagnosis"
    bio: |
      Leading researcher in AI for process systems engineering. Work on process monitoring,
      fault diagnosis, and multimodal data fusion, combining process measurements, text, and
      images, is directly relevant to LLM applications in process industries. Brings
      perspective on developments in the rapidly growing AI and process systems research
      community in Asia.
  - name: "Prof. Benben Jiang"
    role: "Speaker & Organizer"
    affiliation: "Tsinghua University"
    title: "Associate Professor, Department of Automation"
    secondary: ""
    location: "Beijing, China"
    photo: "/assets/img/ifac2026/benben.jpg"
    profile_url: "https://www.au.tsinghua.edu.cn/en/info/1076/3244.htm"
    sessions: "Application IV — LLM-Empowered Battery Diagnosis and Self-Improving Reasoning · Hands-On · Roundtable panellist"
    bio: |
      Research focuses on AI for energy, Bayesian machine learning and Bayesian optimization,
      fault diagnosis, and lithium-ion batteries. Recent work combines physics-informed
      interpretation with LLM reasoning for intelligent battery fault diagnosis, including the
      BatteryAgent and BatteryBERT frameworks.
